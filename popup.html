<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 310px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb;
      margin: 0;
      color: #111827;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section {
      margin-bottom: 12px;
    }
    label {
      font-size: 12px;
      font-weight: bold;
      color: #374151;
      display: block;
      margin-bottom: 4px;
    }
    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    input[type="password"]:focus {
      border-color: #2563eb;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      font-size: 13px;
      transition: background-color 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
    .btn-secondary:hover {
      background: #d1d5db;
    }
    .info-box {
      font-size: 11px;
      color: #6b7280;
      background: #f3f4f6;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 8px;
      line-height: 1.4;
    }
    #status {
      font-size: 12px;
      color: #2563eb;
      margin-top: 8px;
      text-align: center;
      font-weight: 600;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <h3>접근성 AI 리더 v2.2</h3>
  
  <div class="section">
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy... 키를 입력하세요">
    <button id="saveKeyBtn" class="btn-secondary">키 저장하기</button>
  </div>

  <div class="section">
    <button id="transformBtn" class="btn-primary">쉬운 글로 변환 (선택/전체)</button>
  </div>

  <div class="info-box">
    - 글 드래그 시 뜨는 버튼 또는 우클릭 메뉴로 변환 가능합니다.<br>
    - 모달 열림 상태 단축키: Ctrl+A (전체 재생), Ctrl+S (정지)
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
